{% extends "base.html" %}
{% block title %}404 — Route not found{% endblock %}
{% block content %}
<section class="not-found">
  <div class="wrap">
    <div class="eyebrow">System log</div>
    <h1 class="section-title big">404 — route not found</h1>
    <p class="section-sub">No page is mapped to this path. It may have moved, or never existed.</p>
    <a href="{{ url_for('home') }}" data-internal class="btn btn-primary">Return home →</a>
  </div>
</section>
{% endblock %}
